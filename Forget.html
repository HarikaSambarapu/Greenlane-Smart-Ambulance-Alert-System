<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Green Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/template.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-truck-medical"></i></div>
            <h1>GREEN LANE</h1>
            <p>Smart Ambulance Alert System</p>
        </div>

        <!-- Default: request reset -->
        <div id="requestView">
            <h2>Reset your password</h2>

            <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px; text-align:center; line-height:1.5;">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <!-- Error / success messages -->
            <div class="auth-error" id="resetError"></div>
            <div class="auth-error" id="resetSuccess"
                 style="background:var(--success-light); color:var(--success-dark); border-color:#bbf7d0;"></div>

            <!-- Email -->
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="resetEmail" placeholder="Your email address" autocomplete="email">
            </div>

            <!-- Submit -->
            <button class="btn btn-primary" id="resetBtn">
                Send Reset Link
            </button>

            <!-- Back to login -->
            <div class="auth-links">
                <span><a href="login.html">← Back to login</a></span>
            </div>
        </div>

    </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

<script src="assets/js/animations.js"></script>
</body>
</html>

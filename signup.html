<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Green Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/template.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-split">

        <div class="auth-illustration">
            <div class="auth-illustration-icon"><i class="fas fa-shield-halved"></i></div>
            <h2>Coordinate faster.</h2>
            <p>Join Green Lane as a driver or traffic controller and help clear the way before every emergency arrives.</p>
        </div>

        <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-truck-medical"></i></div>
            <h1>GREEN LANE</h1>
            <p>Smart Ambulance Alert System</p>
        </div>

        <h2>Create your account</h2>

        <!-- Error message -->
        <div class="auth-error" id="signupError"></div>

        <!-- Role selection - visible cards drive the hidden <select id="role">
             that auth.js actually reads, so signup logic is untouched. -->
        <div class="role-select-grid">
            <div class="role-select-card" data-role="driver" onclick="selectRole('driver')">
                <i class="fas fa-truck-medical"></i>
                <span>I am a Driver</span>
            </div>
            <div class="role-select-card selected" data-role="traffic_police" onclick="selectRole('traffic_police')">
                <i class="fas fa-shield-halved"></i>
                <span>I am a Police Officer</span>
            </div>
        </div>
        <select id="role" style="display:none;">
            <option value="traffic_police" selected>Traffic Police / Controller</option>
            <option value="driver">Ambulance Driver</option>
        </select>

        <!-- Full Name -->
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="name" placeholder="Full name" autocomplete="name">
        </div>

        <!-- Email -->
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Email address" autocomplete="email">
        </div>

        <!-- Password -->
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password (min 6 characters)">
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <!-- Submit -->
        <button class="btn btn-primary" id="signupBtn">
            Create Account
        </button>

        <!-- Links -->
        <div class="auth-links">
            <span>Already have an account? <a href="login.html">Sign in</a></span>
        </div>

        </div>
    </div>
</div>

<script>
    function selectRole(value) {
        document.getElementById("role").value = value;
        document.querySelectorAll(".role-select-card").forEach(card => {
            card.classList.toggle("selected", card.dataset.role === value);
        });
    }
</script>

<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

<script src="assets/js/animations.js"></script>
</body>
</html>

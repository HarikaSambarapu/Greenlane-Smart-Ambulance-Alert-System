<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications – Green Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F3F5F9;
            color: #111827;
            min-height: 100vh;
        }

        /* ── TOP BAR ── */
        .top-bar {
            background: #16213A;
            color: white;
            padding: 15px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-left { display: flex; align-items: center; gap: 12px; }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.14);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .top-bar h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.1px; }
        .top-bar h2 i { color: #F97316; }
        .top-bar p { font-size: 11.5px; color: #94A3B8; margin-top: 1px; }

        /* ── BADGE COUNT ── */
        .badge {
            background: #DC2626;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            min-width: 22px;
            text-align: center;
        }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid #E5E7EB;
        }
        .toolbar span { font-size: 13px; color: #6B7280; }

        .clear-btn {
            background: none;
            border: 1.5px solid #E5E7EB;
            color: #111827;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .clear-btn:hover { background: #FEF2F2; border-color: #DC2626; color: #DC2626; }

        /* ── NOTIFICATION LIST ── */
        .notif-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ── NOTIFICATION CARD ── */
        .notif-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 1px 3px rgba(16,24,40,0.05);
            border: 1px solid #E5E7EB;
            border-left: 3px solid #E5E7EB;
            animation: slideIn 0.2s ease;
            position: relative;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Card colour themes by type - limited to the brand palette */
        .notif-card.emergency { border-left-color: #DC2626; }
        .notif-card.ended     { border-left-color: #16A34A; }
        .notif-card.user      { border-left-color: #2563EB; }
        .notif-card.info      { border-left-color: #F97316; }

        /* Icon circle */
        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .emergency .notif-icon  { background: #FEF2F2; }
        .ended     .notif-icon  { background: #ECFDF3; }
        .user      .notif-icon  { background: #EFF6FF; }
        .info      .notif-icon  { background: #FFF1E8; }

        .notif-body { flex: 1; min-width: 0; }

        .notif-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 3px;
        }

        .notif-title { font-size: 14px; font-weight: 600; color: #111827; }

        /* Status badge - small pill next to the title */
        .notif-status {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .emergency .notif-status { background: #FEF2F2; color: #DC2626; }
        .ended     .notif-status { background: #ECFDF3; color: #16A34A; }
        .user      .notif-status { background: #EFF6FF; color: #2563EB; }
        .info      .notif-status { background: #FFF1E8; color: #EA580C; }

        .notif-msg {
            font-size: 13px;
            color: #4B5563;
            line-height: 1.45;
            word-break: break-word;
        }

        .notif-time {
            font-size: 11px;
            color: #9CA3AF;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Delete button on card */
        .notif-delete {
            background: none;
            border: none;
            color: #D1D5DB;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: color 0.15s ease;
            flex-shrink: 0;
        }
        .notif-delete:hover { color: #DC2626; }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
            display: none;
        }
        .empty-state i { font-size: 46px; color: #D1D5DB; margin-bottom: 16px; }
        .empty-state h3 { font-size: 17px; color: #111827; margin-bottom: 8px; font-weight: 700; }
        .empty-state p { font-size: 14px; }

        /* ── HOME BUTTON ── */
        .footer-bar { padding: 16px; text-align: center; max-width: 680px; margin: 0 auto 20px; }

        .home-btn {
            background: #F97316;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(16,24,40,0.06);
            transition: background 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .home-btn:hover { background: #EA580C; }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-bar-left">
        <button class="back-btn" onclick="window.location.href='home.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h2><i class="fas fa-bell" style="font-size:15px; margin-right:6px;"></i>Notifications</h2>
            <p>Green Lane Alert Feed</p>
        </div>
    </div>
    <span class="badge" id="notifBadge">0</span>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
    <span id="notifCountText">Loading...</span>
    <button class="clear-btn" onclick="clearAll()">
        <i class="fas fa-trash-alt"></i> Clear All
    </button>
</div>

<!-- NOTIFICATION LIST -->
<div class="notif-list" id="notifList"></div>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState">
    <i class="fas fa-bell-slash"></i>
    <h3>All clear!</h3>
    <p>No notifications yet. Emergency alerts will appear here.</p>
</div>

<!-- HOME BUTTON -->
<div class="footer-bar">
    <button class="home-btn" onclick="window.location.href='home.html'">
        <i class="fas fa-home"></i> Back to Home
    </button>
</div>

<script type="module">
     import { db } from "./firebase.js";

import {
collection,
query,
orderBy,
onSnapshot,
deleteDoc,
doc,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    // ── HELPERS ──────────────────────────────────────────

    // Detect notification type from its text to pick icon + theme
    function getTypeInfo(text) {
        const t = text.toLowerCase();
        if (t.includes("emergency started") || t.includes("approaching") || t.includes("give way")) {
            return { type: "emergency", icon: '<i class="fas fa-truck-medical" style="color:#DC2626;"></i>', label: "Emergency Alert" };
        }
        if (t.includes("emergency ended") || t.includes("all clear")) {
            return { type: "ended", icon: '<i class="fas fa-circle-check" style="color:#16A34A;"></i>', label: "Emergency Ended" };
        }
        if (t.includes("traffic police") || t.includes("junction") || t.includes("police")) {
            return { type: "user", icon: '<i class="fas fa-shield-halved" style="color:#2563EB;"></i>', label: "Traffic Police Update" };
        }
        if (t.includes("emergency alert") || t.includes("approaching your junction")) {
            return { type: "emergency", icon: '<i class="fas fa-truck-medical" style="color:#DC2626;"></i>', label: "Emergency Alert" };
        }
        return { type: "info", icon: '<i class="fas fa-circle-info" style="color:#EA580C;"></i>', label: "Notification" };
    }

    // Short status-pill label shown next to the notification title
    function getStatusLabel(type) {
        switch (type) {
            case "emergency": return "Alert";
            case "ended":     return "Resolved";
            case "user":      return "Update";
            default:          return "Info";
        }
    }

    // Format a stored notification. Old ones are plain strings;
    // new ones will be JSON objects with { text, time }.
    function parseNotif(raw) {
        try {
            const obj = JSON.parse(raw);
            if (obj && obj.text) return obj;
        } catch (e) { /* not JSON – it's an old plain string */ }
        return { text: raw, time: null };
    }

    function formatTime(isoString) {
        if (!isoString) return "Earlier";
        const d = new Date(isoString);
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1)  return "Just now";
        if (diffMin < 60) return diffMin + " min ago";
        const diffH = Math.floor(diffMin / 60);
        if (diffH < 24)   return diffH + " hr ago";
        return d.toLocaleDateString();
    }

    function renderNotifications(snapshot){

    const list = document.getElementById("notifList");
    const empty = document.getElementById("emptyState");
    const badge = document.getElementById("notifBadge");
    const count = document.getElementById("notifCountText");

    list.innerHTML = "";

    if(snapshot.empty){

        empty.style.display = "block";
        badge.innerText = "0";
        count.innerText = "No Notifications";
        return;
    }

    empty.style.display = "none";

    badge.innerText = snapshot.size;
    count.innerText = snapshot.size + " Notifications";

    const docs = [...snapshot.docs].reverse();

    docs.forEach(notification => {

        const data = notification.data();

        const info = getTypeInfo(data.message);

        const card = document.createElement("div");

        card.className = "notif-card " + info.type;

        const time = data.time
            ? formatTime(data.time.toDate())
            : "Just now";

        card.innerHTML = `
            <div class="notif-icon">${info.icon}</div>

            <div class="notif-body">

                <div class="notif-title-row">
                    <div class="notif-title">${info.label}</div>
                    <span class="notif-status">${getStatusLabel(info.type)}</span>
                </div>

                <div class="notif-msg">
                    ${data.message}
                </div>

                <div class="notif-time">
                    <i class="fas fa-clock"></i>
                    ${time}
                </div>

            </div>

            <button class="notif-delete"
                onclick="deleteOne('${notification.id}')">
                <i class="fas fa-trash"></i>
            </button>
        `;

        list.appendChild(card);

    });

}

    // ── ACTIONS ──────────────────────────────────────────

async function deleteOne(id) {
    await deleteDoc(doc(db, "Notifications", id));
}

async function clearAll() {



    const role = localStorage.getItem("role");

    const snapshot = await getDocs(collection(db, "Notifications"));

    const deletions = [];

    snapshot.forEach((d) => {
        // If no role is set in storage, delete everything. Otherwise delete only matching-role docs.
        const docRole = d.data().role;
        if (!role || docRole === role) {
            deletions.push(deleteDoc(doc(db, "Notifications", d.id)));
        }
    });

    if (deletions.length === 0) {
        alert('No notifications found to clear.');
        return;
    }

    await Promise.all(deletions);
    alert('Cleared ' + deletions.length + ' notifications.');
}

    // ── INIT ─────────────────────────────────────────────
    const role = localStorage.getItem("role");
const q = query(
    collection(db, "Notifications"),
    orderBy("time", "desc")
);

onSnapshot(q, (snapshot) => {

    const list = document.getElementById("notifList");
    const empty = document.getElementById("emptyState");
    const badge = document.getElementById("notifBadge");
    const count = document.getElementById("notifCountText");

    list.innerHTML = "";

    const filteredDocs = snapshot.docs.filter(doc => {
        return doc.data().role === role;
    });

    // EMPTY STATE FIX
    if (filteredDocs.length === 0) {
        empty.style.display = "block";
        badge.innerText = "0";
        count.innerText = "No Notifications";
        return;
    }

    empty.style.display = "none";

    badge.innerText = filteredDocs.length;
    count.innerText = filteredDocs.length + " Notifications";

    filteredDocs.forEach((notification) => {

        const data = notification.data();
        const info = getTypeInfo(data.message);

        const time =
    data.time && data.time.toDate
        ? formatTime(data.time.toDate().toISOString())
        : "Just now";

        const card = document.createElement("div");
        card.className = "notif-card " + info.type;

        card.innerHTML = `
            <div class="notif-icon">${info.icon}</div>
  
            <div class="notif-body">
                <div class="notif-title-row">
                    <div class="notif-title">${info.label}</div>
                    <span class="notif-status">${getStatusLabel(info.type)}</span>
                </div>

                <div class="notif-msg">
                    ${data.message}
                </div>

                <div class="notif-time">
                    <i class="fas fa-clock"></i>
                    ${time}
                </div>
            </div>

            <button class="notif-delete" data-id="${notification.id}">
                <i class="fas fa-trash"></i>
            </button>
        `;

        list.appendChild(card);
    });

    // attach delete events properly (no inline onclick)
    document.querySelectorAll(".notif-delete").forEach(btn => {
        btn.onclick = async () => {
            const id = btn.getAttribute("data-id");
            await deleteDoc(doc(db, "Notifications", id));
        };
    });

});

window.deleteOne = deleteOne;
window.clearAll = clearAll;
 
</script>

</body>
</html>
